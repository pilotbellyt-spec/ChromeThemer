[package]
name = "chromethemer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.97"

[dependencies]
anyhow = "1"
brotli = "8"
base64 = "0.22"
cap-std = "4"
clap = { version = "4", features = ["derive"] }
cssparser = "0.37"
flate2 = "1"
fs2 = "0.4"
percent-encoding = "2"
oxc = { version = "=0.155.0", features = ["ast_visit"] }
rolldown = "=1.2.15"
rolldown_common = "=1.2.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
